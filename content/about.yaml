title: Hi, I'm Pooya Nikbakht
lead: >-
  A senior full-stack engineer in Toronto who builds websites, web apps and AI
  tools for small businesses and startups.
metaDescription: >-
  Senior full-stack engineer with 10+ years of experience: former startup
  founder and product owner, MSc in Computer Science (University of Manitoba)
  with published research on bin packing, BSc in Software Engineering. Available
  evenings and weekends, Eastern Time.
intro:
  - >-
    I've spent more than 10 years building web products, and I've seen them from
    every side. I started by founding my own startup, then led product and
    delivery as a product owner and Scrum Master on one of the top Persian news
    apps. Today I'm a senior full-stack engineer at ApplyBoard, an international
    education marketplace used by hundreds of thousands of students, working on
    high-traffic search over hundreds of thousands of programs, recommendation
    systems, microservices on AWS, and AI features used every day.
  - >-
    Underneath that is a strong technical foundation: an MSc in Computer Science
    with a perfect GPA and peer-reviewed research on optimization algorithms,
    and an AWS Certified Solutions Architect certification.
  - >-
    What that means for you: I start from your customers and your business, not
    the tech. Then I build it the way large teams do, with clean architecture,
    fast pages, and AI that is tested before it ships, sized to what your
    business actually needs.
howIWork:
  - title: Plan in writing.
    text: >-
      After a short call I send a written plan with scope, milestones, and
      price.
  - title: Ship small.
    text: >-
      Work lands in small milestones you can see and test, not in one big reveal
      at the end.
  - title: Communicate async.
    text: I send clear written updates you can read at the start of your day.
  - title: Sweat the details.
    text: >-
      Nothing ships half-baked, including the parts you never see: the code, the
      data, and the edge cases get the same care as the screens.
  - title: Do it right, at the price we agreed.
    text: >-
      If doing something properly takes me longer than planned, that's on me.
      You pay what we agreed, not a surprise bill.
  - title: Leave it maintainable.
    text: Clean code, a README, and a handoff, so the next developer can pick it up.
  - title: Stay after launch.
    text: >-
      Launch is the start, not the end. I stay available for fixes, questions,
      and the next round of improvements once real customers start using it.
